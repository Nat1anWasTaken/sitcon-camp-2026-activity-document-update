name: Update HackMD Book

on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:

concurrency:
  group: update-hackmd-book
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: "update-hackmd-book"
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update HackMD book note
        env:
          HACKMD_API_TOKEN: ${{ secrets.HACKMD_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-oss-120b:free' }}
          HACKMD_TEAM_PATH: SITCON
          HACKMD_FOLDER_URL: ${{ secrets.HACKMD_FOLDER_URL }}
          HACKMD_BOOK_DOCS_URL: ${{ secrets.HACKMD_BOOK_DOCS_URL }}
          README_PATH: README.md
        run: |
          : "${HACKMD_API_TOKEN:?Missing HACKMD_API_TOKEN repository secret}"
          : "${OPENROUTER_API_KEY:?Missing OPENROUTER_API_KEY repository secret}"
          pnpm update-book

      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update readme with latest content"
          git push
