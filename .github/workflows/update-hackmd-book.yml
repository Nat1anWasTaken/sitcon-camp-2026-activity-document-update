name: Update HackMD Book

on:
  schedule:
    - cron: "0 2,14 * * *"
  workflow_dispatch:

concurrency:
  group: update-hackmd-book
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update HackMD book note
        env:
          HACKMD_API_TOKEN: ${{ secrets.HACKMD_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4.1-mini' }}
          HACKMD_TEAM_PATH: SITCON
          HACKMD_FOLDER_ID: AR1yLLpMhRw7Z9yOz7o3T
          HACKMD_BOOK_NOTE_ID: 12lshlVaTGmaEG1RIKkuYw
        run: |
          : "${HACKMD_API_TOKEN:?Missing HACKMD_API_TOKEN repository secret}"
          : "${OPENROUTER_API_KEY:?Missing OPENROUTER_API_KEY repository secret}"
          npm run update-book
